name: Monitorar fontes
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe do coletor
        run: python -m py_compile scripts/coletar.py
      - name: Monitorar metadados (sem publicar vereditos)
        run: python scripts/coletar.py
      - name: Guardar resultados como artefato para revisão
        uses: actions/upload-artifact@v4
        with:
          name: descobertas-pendentes
          path: data/monitoramento/descobertas.json
          retention-days: 30
