name: Qualidade do projeto
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/qualidade.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes de publicação e monitoramento
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Conferir integridade dos dados publicados
        run: |
          python scripts/gerar_publicados.py
          git diff --exit-code -- data/publicados.json
